version: '3'
services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: jhu
      POSTGRES_PASSWORD: jhu123
      POSTGRES_DB: final_project
    ports:
      - "5432:5432"
    volumes:
      - ./shared:/home/jhu

  airflow-jupyter:
    build: .
    ports:
      - "8888:8888"
      - "8080:8080"
    volumes:
      - .:/home/jhu
    depends_on:
      - postgres
      # The line below should be "- mongodb"
      - mongodb
    environment:
      - AIRFLOW_HOME=/home/jhu/airflow
      - AIRFLOW__CORE__DAGS_FOLDER=/home/jhu/airflow/dags
    command: >
      bash -c "
      mkdir -p /home/jhu/airflow/dags &&
      airflow db init &&
      airflow users create -r Admin -u admin -p admin -e admin@example.com -f Admin -l User &&
      service cron start &&
      jupyter lab --ip=0.0.0.0 --no-browser --allow-root &&
      chmod 0600 /home/jhu/.local/share/jupyter/runtime/jupyter_cookie_secret"
      
  flask-api:
    build: .
    command: python3 /home/jhu/api/api_app.py
    ports:
      - "5000:5000"
    volumes:
      - .:/home/jhu
    depends_on:
      - postgres
    environment:
      - FLASK_ENV=development


  mongodb:
    image: mongo:7.0.10-rc0-jammy
    ports:
      - "27018:27018"
    volumes:
      - mongodb_data:/data/db

    

volumes:
  mongodb_data:
